<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가히의 만물상 🧪 — 유용한 웹 도구 모음</title>
<meta name="description" content="생일 촛불 계산기, 영양정보표 생성기, 신두리 맛집 지도, 앵무새 병원 찾기 등 일상에서 바로 쓸 수 있는 무료 웹 도구 모음입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6446265269346794" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sidebar-w: 300px;
    --bg: #f5f3ef;
    --sidebar-bg: #ffffff;
    --text: #2d2a26;
    --text-sub: #8a857d;
    --accent: #ff6b35;
    --accent2: #6c5ce7;
    --accent3: #00b894;
    --border: #e8e4dd;
    --card-hover: #faf8f5;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --radius: 14px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }

  /* ───────── SIDEBAR ───────── */
  .sidebar {
    width: var(--sidebar-w);
    height: 100vh;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    z-index: 100;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .sidebar-header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Gaegu', cursive;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo .wave {
    display: inline-block;
    animation: wave 2s ease-in-out infinite;
    transform-origin: 70% 70%;
  }

  @keyframes wave {
    0%,100% { transform: rotate(0deg); }
    15% { transform: rotate(14deg); }
    30% { transform: rotate(-8deg); }
    40% { transform: rotate(14deg); }
    50% { transform: rotate(-4deg); }
    60% { transform: rotate(10deg); }
    70% { transform: rotate(0deg); }
  }

  .logo-sub {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 4px;
    font-weight: 300;
  }

  /* ── App List ── */
  .app-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  .app-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid transparent;
    margin-bottom: 6px;
    position: relative;
  }

  .app-item:hover {
    background: var(--card-hover);
  }

  .app-item.active {
    background: #fff8f4;
    border-color: var(--accent);
  }

  .app-item.active::before {
    content: '';
    position: absolute;
    left: -14px;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 24px;
    background: var(--accent);
    border-radius: 0 4px 4px 0;
  }

  .app-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .app-item:nth-child(1) .app-icon { background: #fff0e8; }
  .app-item:nth-child(2) .app-icon { background: #e8f8ee; }
  .app-item:nth-child(3) .app-icon { background: #ede8ff; }
  .app-item:nth-child(4) .app-icon { background: #e0f2f1; }

  .app-info { min-width: 0; }

  .app-name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .app-desc {
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Sidebar Footer ── */
  .sidebar-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    text-align: center;
  }

  .sidebar-footer p {
    font-family: 'Gaegu', cursive;
    font-size: 13px;
    color: var(--text-sub);
  }

  .sidebar-footer .heart {
    color: #e74c3c;
    display: inline-block;
    animation: heartbeat 1.5s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }

  /* ───────── MAIN AREA ───────── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
  }

  /* Top Bar */
  .topbar {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-shrink: 0;
  }

  .hamburger {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .hamburger:hover { background: var(--card-hover); }

  .hamburger svg {
    width: 24px;
    height: 24px;
    stroke: var(--text);
    stroke-width: 2;
    fill: none;
  }

  .current-app-name {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .current-app-badge {
    font-size: 10px;
    background: #ffe8d6;
    color: #c75000;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .open-tab {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-sub);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 8px;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .open-tab:hover {
    background: var(--card-hover);
    color: var(--text);
  }

  .open-tab svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  /* Iframe Container */
  .iframe-wrap {
    flex: 1;
    position: relative;
    background: white;
  }

  .iframe-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Loading state */
  .iframe-loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: white;
    z-index: 10;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .iframe-loading.hidden {
    opacity: 0;
  }

  .loader {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-sub);
  }

  /* ── Mobile Overlay ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 99;
    opacity: 0;
    transition: opacity 0.35s;
  }

  .overlay.show {
    opacity: 1;
  }

  /* ───────── RESPONSIVE ───────── */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      transform: translateX(-100%);
      box-shadow: var(--shadow-md);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .overlay {
      display: block;
    }

    .hamburger {
      display: flex;
    }

    .main {
      width: 100%;
    }
  }
</style>
</head>
<body>

<!-- Overlay for mobile sidebar -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- ──── SIDEBAR ──── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">가히의 만물상 <span class="wave">🧪</span></div>
    <div class="logo-sub">일상에서 바로 쓰는 무료 웹 도구</div>
  </div>

  <nav class="app-list" id="appList">
    <div class="app-item active" data-url="https://yoongahee.com/how-many-candles" data-name="How many candles?" onclick="loadApp(this)">
      <div class="app-icon">🎂</div>
      <div class="app-info">
        <div class="app-name">How many candles?</div>
        <div class="app-desc">생일 촛불 개수 계산기</div>
      </div>
    </div>

    <div class="app-item" data-url="https://yoongahee.com/nutrition" data-name="영양정보표 만들어 드림" onclick="loadApp(this)">
      <div class="app-icon">🏷️</div>
      <div class="app-info">
        <div class="app-name">영양정보표 만들어 드림</div>
        <div class="app-desc">식품 영양성분 라벨 생성</div>
      </div>
    </div>

    <div class="app-item" data-url="https://yoongahee.com/sinduri-map" data-name="신두리 지도" onclick="loadApp(this)">
      <div class="app-icon">🗺️</div>
      <div class="app-info">
        <div class="app-name">태안 현지인의 신두리 지도</div>
        <div class="app-desc">직접 가본 맛집·카페만</div>
      </div>
    </div>

    <div class="app-item" data-url="https://yoongahee.com/parrot-hospitals/" data-name="앵무새 병원 모음집" onclick="loadApp(this)">
      <div class="app-icon">🦜</div>
      <div class="app-info">
        <div class="app-name">앵무새 병원 모음집</div>
        <div class="app-desc">전국 조류 진료 동물병원</div>
      </div>
    </div>
  </nav>

  <div class="sidebar-footer">
    <p>만드는 재미로 사는 중 <span class="heart">♥</span></p>
  </div>
</aside>

<!-- ──── MAIN ──── -->
<div class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="메뉴 열기">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span class="current-app-name" id="currentAppName">How many candles?</span>
    <span class="current-app-badge">실행 중</span>
    <a class="open-tab" id="openTabLink" href="https://yoongahee.com/how-many-candles" target="_blank">
      새 탭에서 열기
      <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
    </a>
  </div>

  <div class="iframe-wrap">
    <div class="iframe-loading" id="iframeLoading">
      <div class="loader"></div>
      <div class="loader-text">앱을 불러오는 중...</div>
    </div>
    <iframe id="appFrame" src="https://yoongahee.com/how-many-candles" title="선택한 앱"></iframe>
  </div>
</div>

<script>
  const frame = document.getElementById('appFrame');
  const loading = document.getElementById('iframeLoading');
  const appName = document.getElementById('currentAppName');
  const openTab = document.getElementById('openTabLink');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');

  // Show loading on iframe load
  frame.addEventListener('load', () => {
    loading.classList.add('hidden');
  });

  function loadApp(el) {
    const url = el.dataset.url;
    const name = el.dataset.name;

    // Update active state
    document.querySelectorAll('.app-item').forEach(item => item.classList.remove('active'));
    el.classList.add('active');

    // Show loading
    loading.classList.remove('hidden');

    // Load iframe
    frame.src = url;

    // Update topbar
    appName.textContent = name;
    openTab.href = url;

    // Close sidebar on mobile
    closeSidebar();
  }

  function toggleSidebar() {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  }
</script>

</body>
</html>
